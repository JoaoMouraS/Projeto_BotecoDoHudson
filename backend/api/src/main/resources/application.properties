spring.application.name=api

# ------------------------------------------------------------------
# Segredos: NUNCA coloque valores reais neste arquivo (ele vai pro git).
# Tudo vem de variáveis de ambiente. Em desenvolvimento, o Spring lê o
# arquivo backend/api/.env (ignorado pelo git) — veja .env.example.
# Nenhuma variável sensível tem valor padrão: se faltar, a API não sobe.
# ------------------------------------------------------------------
spring.config.import=optional:file:.env[.properties]

# Banco de dados (Supabase / PostgreSQL)
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# As tabelas ficam no schema "boteco", que NÃO é exposto pela API REST
# automática do Supabase (só o "public" é). Assim, mesmo com a chave
# publishable do projeto, ninguém consegue ler as tabelas direto.
app.db.schema=boteco
spring.jpa.properties.hibernate.default_schema=${app.db.schema}

# O esquema é criado/versionado pelo Flyway (src/main/resources/db/migration).
# O Hibernate só valida — nunca altera tabelas sozinho em produção.
spring.flyway.enabled=true
spring.flyway.schemas=${app.db.schema}
spring.flyway.default-schema=${app.db.schema}
spring.flyway.create-schemas=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# O compose.yaml é só para quem quiser um Postgres local; não sobe sozinho.
spring.docker.compose.enabled=false

# Admin inicial (opcional). Se ADMIN_EMAIL ou ADMIN_PASSWORD não estiverem
# definidos, nenhum admin é criado.
app.admin.email=${ADMIN_EMAIL:}
app.admin.senha=${ADMIN_PASSWORD:}

# JWT — obrigatório, mínimo 32 caracteres aleatórios.
api.security.token.secret=${JWT_SECRET}

# Atrás de um proxy (produção), confia em X-Forwarded-* só de proxies internos:
# assim o IP do rate limit e o HTTPS do cookie são detectados corretamente.
server.forward-headers-strategy=native

# Regras da casa para reservas (não são segredos; o front lê em /api/reservas/regras).
#  - dia de EVENTO: mesa para 8 a 30 pessoas; libera quando 8 (anfitrião incluso)
#    retirarem o convite; segurada até 20h, sem check-in a mesa é liberada;
#  - dia SEM evento: a casa fica exclusiva para o grupo, mínimo 60 pessoas.
app.reservas.minimo-pessoas=8
app.reservas.maximo-pessoas=30
app.reservas.minimo-pessoas-exclusiva=60
app.reservas.maximo-pessoas-exclusiva=300
app.reservas.dias-minimos-exclusiva=7
app.reservas.horario-limite-chegada=20:00
app.reservas.mesas-por-evento=20
app.reservas.dias-antecedencia-maxima=180
app.reservas.reservas-ativas-por-usuario=3

# Endereço público do site: usado nos links dos e-mails e na prévia do WhatsApp.
app.url=${APP_URL:http://localhost:5173}

# E-mail (SMTP). Sem MAIL_HOST, em desenvolvimento os links aparecem no console.
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.email-from=${MAIL_FROM:Boteco do Hudson <nao-responda@localhost>}

# Sympla (opcional): token em Minha Conta > Integrações.
app.sympla-token=${SYMPLA_TOKEN:}
app.sympla-url=https://api.sympla.com.br/public/v1.5.1/events

# Upload de fotos
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB

# Respostas de erro nunca devolvem stacktrace/mensagens internas.
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
