spring.application.name=api

# Carrega variaveis locais de backend/api/.env quando o projeto roda fora de um
# ambiente de deploy. Variaveis do ambiente de execucao continuam tendo prioridade.
spring.config.import=optional:file:.env[.properties]


# Configurações do Admin Padrão
# O formato ${VARIAVEL:valor_padrao} permite ter um valor reserva, 
# mas não vamos colocar a senha padrão aqui!
app.admin.email=${ADMIN_EMAIL:jaokrito@gmail.com}
app.admin.senha=${ADMIN_PASSWORD:senha123}
#Secret key
api.security.token.secret=${JWT_SECRET:change-this-in-production}

# Conexão com o PostgreSQL local do computador
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/BotecoDoHudson_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.data-source-properties.sslmode=${DB_SSLMODE:disable}

# DESATIVA o controle dinâmico de portas do Spring Boot Docker Compose
#spring.docker.compose.lifecycle-management=none

# Opcional: ajuda a criar ou atualizar as tabelas automaticamente no início
# Configuração do Hibernate para atualizar o esquema do banco de dados automaticamente
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

